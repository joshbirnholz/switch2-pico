name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host unit tests
        run: make -C test

  firmware-pico2w:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          # Bounded network waits and retries: a stalled mirror once hung
          # this step until the job timed out.
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 600 $apt update
          timeout 900 $apt install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cmake ninja-build
      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 -b 2.2.0 https://github.com/raspberrypi/pico-sdk "$RUNNER_TEMP/pico-sdk"
          git -C "$RUNNER_TEMP/pico-sdk" submodule update --init --depth 1
      - name: Build
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2_w
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: switch2-pico2w-firmware
          path: |
            build/switch2_pico.uf2
            build/switch2_pico.elf

  firmware-nrf52840:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52@1.7.0
          pip install adafruit-nrfutil
      - name: Build
        run: nrf52/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: switch2-nrf52840-firmware
          path: |
            build-nrf/switch2_nrf52840.uf2
            build-nrf/switch2_nrf.ino.hex

  # The Decky plugin (decky-plugin/): its installable zip.
  decky-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: decky-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: python3 -m py_compile main.py
      - run: ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: switch2-pico-decky
          path: decky-plugin/out/Switch2-Pico.zip

  # Every push to the default branch refreshes one rolling pre-release,
  # "latest", so the UF2 files can be downloaded directly (artifacts need a
  # GitHub login and come zipped).
  release:
    # Runs when the tests and the nRF52840 build pass; the Pico file is
    # included when its build succeeded (a hung Pico job doesn't hold this up).
    if: >-
      always() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch &&
      needs.test.result == 'success' && needs.firmware-nrf52840.result == 'success'
    needs: [test, firmware-pico2w, firmware-nrf52840, decky-plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(head -n1 VERSION)
          short=${GITHUB_SHA::7}
          cp dist/switch2-nrf52840-firmware/switch2_nrf52840.uf2 "switch2-pico-v$ver-nrf52840.uf2"
          if [ -f dist/switch2-pico2w-firmware/switch2_pico.uf2 ]; then
            cp dist/switch2-pico2w-firmware/switch2_pico.uf2 "switch2-pico-v$ver-pico2w.uf2"
          fi
          notes="Built from $short on ${{ github.ref_name }}. Flash the .uf2 for your board (double-tap reset on nRF52840 boards, hold BOOTSEL on a Pico) or use Update on the configuration page."
          # The "latest" tag stays where it was created: moving it to a commit
          # that touches a workflow file needs a token with workflows
          # permission. The files and notes are what change.
          if gh release view latest >/dev/null 2>&1; then
            # Drop the previous build's files (their names carry the old version).
            for a in $(gh release view latest --json assets -q '.assets[].name'); do
              gh release delete-asset latest "$a" -y
            done
            gh release edit latest --title "Latest build (v$ver, $short)" --notes "$notes" --prerelease
          else
            gh release create latest --target "$GITHUB_SHA" --title "Latest build (v$ver, $short)" --notes "$notes" --prerelease
          fi
          if [ -f dist/switch2-pico-decky/Switch2-Pico.zip ]; then
            pver=$(jq -r .version decky-plugin/package.json)
            cp dist/switch2-pico-decky/Switch2-Pico.zip "switch2-pico-decky-v$pver.zip"
          fi
          gh release upload latest switch2-pico-v$ver-*.uf2 switch2-pico-decky-v*.zip --clobber

  # Publishes the configuration page (web/) together with the latest firmware
  # (fw/) to GitHub Pages: https://joshbirnholz.github.io/switch2-pico/. The
  # page is also the WebUSB landing page Chrome offers when the dongle is
  # plugged in, and its "Update" button downloads fw/latest.json and the
  # .uf2 files from here (GitHub release downloads can't be fetched from a
  # web page: they send no CORS headers). The Decky plugin checks
  # decky/latest.json for its own updates. Enable once under Settings ->
  # Pages -> Source: GitHub Actions.
  pages:
    if: >-
      always() && needs.test.result == 'success' && needs.firmware-nrf52840.result == 'success' &&
      ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch')
    needs: [test, firmware-pico2w, firmware-nrf52840, decky-plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Assemble the site
        run: |
          ver=$(head -n1 VERSION)
          mkdir -p site/fw
          cp -r web/. site/
          cp dist/switch2-nrf52840-firmware/switch2_nrf52840.uf2 site/fw/switch2-pico-nrf52840.uf2
          files='"nrf52840": "switch2-pico-nrf52840.uf2"'
          if [ -f dist/switch2-pico2w-firmware/switch2_pico.uf2 ]; then
            cp dist/switch2-pico2w-firmware/switch2_pico.uf2 site/fw/switch2-pico-pico2w.uf2
            files="$files, \"pico2w\": \"switch2-pico-pico2w.uf2\""
          fi
          cat > site/fw/latest.json <<JSON
          {"version": "$ver", "sha": "${GITHUB_SHA::7}",
           "files": {$files}}
          JSON
          cat site/fw/latest.json
          if [ -f dist/switch2-pico-decky/Switch2-Pico.zip ]; then
            mkdir -p site/decky
            cp dist/switch2-pico-decky/Switch2-Pico.zip site/decky/Switch2-Pico.zip
            pver=$(jq -r .version decky-plugin/package.json)
            sum=$(sha256sum site/decky/Switch2-Pico.zip | cut -d' ' -f1)
            echo "{\"version\": \"$pver\", \"file\": \"Switch2-Pico.zip\", \"sha256\": \"$sum\"}" > site/decky/latest.json
            cat site/decky/latest.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
