# Publishes web/index.html to GitHub Pages. This is the WebUSB landing page
# (https://joshbirnholz.github.io/switch2-pico/) that Chrome offers when the
# dongle is plugged in. Enable it once under Settings -> Pages -> Source:
# "GitHub Actions" (Pages on a private repository needs a paid plan; the
# published page itself is always public).
name: Pages

on:
  push:
    # The repository's default branch is the working branch; the github-pages
    # environment only accepts deployments from the default branch by default.
    branches: [main, claude/dazzling-wright-gxo6vj]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
